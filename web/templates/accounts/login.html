{% extends 'base.html' %}{% block title %}Sign in · Neighbourhood Market{% endblock %}
{% block content %}<section class="auth"><p class="eyebrow">Welcome back</p><h1>Sign in</h1><p class="muted">Your stores, carts, and orders in one place.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button>Sign in</button></form>
<p>New here? <a href="{% url 'register' %}">Create an account</a>.</p></section>{% endblock %}
