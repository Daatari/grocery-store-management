name: grocery-lab
x-app: &app
  build:
    context: ..
    dockerfile: deployment/Dockerfile
  image: grocery-lab:local
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &environment
    GROCERY_DEBUG: '0'
    GROCERY_LOCAL_SANDBOX: '1'
    GROCERY_SECRET_KEY: ${GROCERY_SECRET_KEY:?Run tools/deploy.py first}
    GROCERY_ALLOWED_HOSTS: localhost,127.0.0.1,web-a,web-b,proxy
    GROCERY_DB_ENGINE: postgres
    PGHOST: database
    PGDATABASE: grocery
    PGUSER: grocery
    PGPASSWORD: ${POSTGRES_PASSWORD:?Run tools/deploy.py first}
    GROCERY_LOG_INDEX: /event-index/events.sqlite
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    GROCERY_PUBLIC_BASE_URL: ${GROCERY_PUBLIC_BASE_URL:-http://localhost:8080}
    GROCERY_PAYMENT_URL: http://validator:9000
    GROCERY_PAYMENT_TOKEN: ${GROCERY_PAYMENT_TOKEN:?Run tools/deploy.py first}
  networks: [internal]
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grocery
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/deploy.py first}
    volumes: [database:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U grocery -d grocery']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    environment:
      <<: *environment
      GROCERY_ADMIN_USER: admin
      GROCERY_ADMIN_PASSWORD: ${GROCERY_ADMIN_PASSWORD:?Run tools/deploy.py first}
      GROCERY_DEMO_PASSWORD: ${GROCERY_DEMO_PASSWORD:?Run tools/deploy.py first}
    command: [sh, -c, 'python manage.py migrate --noinput && python manage.py init_admin && python manage.py seed_demo --if-empty --quiet']
    depends_on:
      database: {condition: service_healthy}
  collector:
    <<: *app
    environment: {}
    command: [python, /app/tools/collect.py, --directory, /logs, --db, /event-index/events.sqlite]
    volumes: [events:/logs:ro, index:/event-index]
    healthcheck:
      test: [CMD, python, -c, 'import pathlib,time; p=pathlib.Path("/event-index/events.heartbeat"); assert p.exists() and time.time()-p.stat().st_mtime < 30']
      interval: 5s
      timeout: 5s
      retries: 12
  web-a:
    <<: *app
    networks: [internal, egress]
    environment:
      <<: *environment
      GROCERY_NODE: web-a
      GROCERY_LOG_DIR: /logs
    volumes: [events:/logs, index:/event-index:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      collector: {condition: service_healthy}
    healthcheck: &web-health
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 12
  web-b:
    <<: *app
    networks: [internal, egress]
    environment:
      <<: *environment
      GROCERY_NODE: web-b
      GROCERY_LOG_DIR: /logs
    volumes: [events:/logs, index:/event-index:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      collector: {condition: service_healthy}
    healthcheck: *web-health
  validator:
    <<: *app
    environment:
      GROCERY_PAYMENT_TOKEN: ${GROCERY_PAYMENT_TOKEN:?Run tools/deploy.py first}
    command: [python, /app/payment_simulator/server.py]
    volumes: [payments:/payment-state]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:9000/health", timeout=3)']
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    networks: [internal, egress]
    environment:
      <<: *environment
      GROCERY_NODE: worker
      GROCERY_LOG_DIR: /logs
    command: [python, manage.py, run_worker]
    volumes: [events:/logs]
    depends_on:
      migrate: {condition: service_completed_successfully}
      validator: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import pathlib,time; p=pathlib.Path("/tmp/grocery-worker.heartbeat"); assert p.exists() and time.time()-p.stat().st_mtime < 60']
      interval: 10s
      timeout: 5s
      retries: 12
  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${GROCERY_PORT:-8080}:8080']
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      web-a: {condition: service_healthy}
      web-b: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/health/']
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  egress: {}
  internal:
    internal: true
volumes:
  database:
  events:
  index:
  payments:
